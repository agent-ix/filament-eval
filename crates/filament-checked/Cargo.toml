[package]
name = "filament-checked"
description = "The checked terms an evaluator reads (ADR-011 layer C): checked bodies, graphs, clause records and identities, split from the checker that builds them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "filament_checked"
path = "src/lib.rs"

[features]
default = ["std"]
# `std` for the crate's own dependencies; without it the crate is `no_std` + `alloc`.
std = ["serde/std", "thiserror/std"]
# The `construct` module: the only constructors of a checked term. Only the
# checker enables it (QSpec FR-400, "Checking authority").
construct = []
# Test-only fixtures. Only a `[dev-dependencies]` entry may enable it.
test-support = []

[dependencies]
filament-semantic-value = { git = "https://github.com/agent-ix/filament-semantic-value", rev = "1df71c27e6db56c8118cf017689aa7fab6156cde", default-features = false }
filament-exact = { git = "https://github.com/agent-ix/filament-exact", rev = "b26a8e4c592503fccdc4a0e3d2cce23dd8487616", default-features = false }
filament-walk = { git = "https://github.com/agent-ix/filament-walk", tag = "v0.1.1", default-features = false }
quire-canonical = { git = "https://github.com/agent-ix/quire-canonical", tag = "v0.3.1", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "2.0.20", default-features = false }

[lints]
workspace = true

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.2" }
