[package]
name = "filament-eval"
description = "The shared evaluation-core interface (ADR-011 layer E): begin an application of a checked closure, step its session, and register resumable host bodies, over the evaluation result vocabulary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "filament_eval"
path = "src/lib.rs"

[dependencies]
filament-semantic-value = { git = "https://github.com/agent-ix/filament-semantic-value", rev = "689f259eab592b62cb362f5e649dba16adf874f7", default-features = false }
filament-exact = { git = "https://github.com/agent-ix/filament-exact", rev = "08a5a1763ef4bd1ea7d1147717c959af5a3522cc", default-features = false }
thiserror = { version = "2.0.20", default-features = false }

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.2" }
syn = { version = "3.0.9", features = ["full", "visit"] }
# The ordered charge log, to assert the exact charge sequence of a run.
filament-exact = { git = "https://github.com/agent-ix/filament-exact", rev = "08a5a1763ef4bd1ea7d1147717c959af5a3522cc", default-features = false, features = ["test-support"] }

[lints]
workspace = true
