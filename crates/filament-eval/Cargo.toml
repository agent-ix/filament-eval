[package]
name = "filament-eval"
description = "The shared evaluation-core interface (ADR-011 layer E): begin an application of a checked closure, step its session, and register resumable host bodies, over the evaluation result vocabulary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "filament_eval"
path = "src/lib.rs"

[dependencies]
filament-semantic-value = { git = "https://github.com/agent-ix/filament-semantic-value", rev = "f5c913bd4fc8880b45e02e3918e02360c530320c", default-features = false }
filament-exact = { git = "https://github.com/agent-ix/filament-exact", rev = "b26a8e4c592503fccdc4a0e3d2cce23dd8487616", default-features = false }
thiserror = { version = "2.0.20", default-features = false }

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.2" }
# The ordered charge log, to assert the exact charge sequence of a run.
filament-exact = { git = "https://github.com/agent-ix/filament-exact", rev = "b26a8e4c592503fccdc4a0e3d2cce23dd8487616", default-features = false, features = ["test-support"] }

[lints]
workspace = true
